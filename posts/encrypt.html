<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Encrypt Post Content</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#161618;color:#e5e5ea;font-family:'SF Mono',Menlo,monospace;padding:40px;max-width:700px;margin:0 auto}
    h1{font-size:18px;margin-bottom:24px;color:#d97757}
    label{display:block;color:#48484a;font-size:12px;margin-bottom:6px;letter-spacing:1px}
    textarea{width:100%;height:300px;background:#1e1e20;border:1px solid #2c2c2e;border-radius:8px;color:#e5e5ea;padding:16px;font-family:inherit;font-size:13px;resize:vertical;outline:none;margin-bottom:20px}
    textarea:focus{border-color:#d97757}
    input{background:#1e1e20;border:1px solid #2c2c2e;border-radius:6px;color:#e5e5ea;padding:10px 16px;font-size:13px;font-family:inherit;outline:none;width:240px;margin-bottom:20px}
    input:focus{border-color:#d97757}
    button{background:#d97757;color:#161618;border:none;border-radius:6px;padding:10px 24px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
    .output{margin-top:24px}
    .output textarea{height:150px;color:#48484a}
    .hint{color:#48484a;font-size:11px;margin-top:8px;line-height:1.6}
  </style>
</head>
<body>
  <h1>Encrypt Post Content</h1>

  <label>HTML CONTENT (paste your article HTML here)</label>
  <textarea id="plaintext" placeholder="<h2>Title</h2><p>Your article content...</p>"></textarea>

  <label>PASSWORD</label>
  <input type="text" id="password" placeholder="enter password">

  <br>
  <button onclick="encryptContent()">Encrypt</button>

  <div class="output" id="output" style="display:none">
    <label>ENCRYPTED OUTPUT (copy this into data-encrypted)</label>
    <textarea id="result" readonly></textarea>
    <div class="hint">
      Copy the output above and paste it into template-encrypted.html<br>
      Replace ENCRYPTED_CONTENT in the data-encrypted attribute.
    </div>
  </div>

<script>
async function encryptContent(){
  var text=document.getElementById('plaintext').value;
  var pwd=document.getElementById('password').value;
  if(!text||!pwd){alert('Fill both fields');return}

  var enc=new TextEncoder();
  var salt=crypto.getRandomValues(new Uint8Array(16));
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var keyMaterial=await crypto.subtle.importKey('raw',enc.encode(pwd),{name:'PBKDF2'},false,['deriveBits','deriveKey']);
  var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:100000,hash:'SHA-256'},keyMaterial,{name:'AES-GCM',length:256},true,['encrypt']);
  var encrypted=await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,enc.encode(text));

  var combined=new Uint8Array(salt.length+iv.length+new Uint8Array(encrypted).length);
  combined.set(salt,0);
  combined.set(iv,16);
  combined.set(new Uint8Array(encrypted),28);

  var b64=btoa(String.fromCharCode.apply(null,combined));
  document.getElementById('result').value=b64;
  document.getElementById('output').style.display='block';
}
</script>
</body>
</html>
